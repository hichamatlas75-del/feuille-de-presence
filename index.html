<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Grey Corner • Présences (Auth + Rôles)</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    :root{
      --primary:#0f172a;
      --muted:#64748b;
      --accent:#c5a059;
      --accent-strong:#b8892d;
      --bg:#f6f6f3;
      --card:#ffffff;
      --soft:#eef2f7;

      --shadow: 0 16px 38px rgba(2,6,23,.10);
      --shadow2: 0 10px 22px rgba(2,6,23,.08);
      --stroke: rgba(2,6,23,.08);
      --stroke2: rgba(2,6,23,.12);
      --ring: 0 0 0 3px rgba(197,160,89,.24);

      --ok-bg: rgba(16,185,129,.14);
      --ok-bd: rgba(16,185,129,.42);
      --ok-tx: #065f46;

      --bad-bg: rgba(239,68,68,.14);
      --bad-bd: rgba(239,68,68,.42);
      --bad-tx: #7f1d1d;

      --warn-bg: rgba(245,158,11,.16);
      --warn-bd: rgba(245,158,11,.44);
      --warn-tx: #92400e;

      --pending-bg: rgba(30,41,59,.06);
      --pending-bd: rgba(30,41,59,.14);
      --pending-tx: rgba(30,41,59,.70);

      --incomplete-bg: rgba(139,92,246,.10);
      --incomplete-bd: rgba(139,92,246,.30);
      --incomplete-tx: #4c1d95;
    }

    body{font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg);color:var(--primary)}
    .glass{background:rgba(255,255,255,.92);backdrop-filter: blur(14px)}
    .card{background:var(--card);border:1px solid var(--stroke)}
    .btn{transition:transform .08s ease, filter .2s ease, box-shadow .2s ease}
    .btn:active{transform:scale(.985)}
    input[type="time"], input[type="date"], input[type="email"], input[type="password"]{-webkit-appearance:none;min-height:48px}
    .chip{border:1px solid var(--stroke2)}
    .chip.active{border-color: rgba(197,160,89,.65); background: rgba(197,160,89,.18); color: #1f2937}
    .sectionTitle{border-left: 3px solid var(--accent);padding-left: 12px;}
    .badge{
      font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
      font-weight: 900; padding: 6px 10px; border-radius: 999px;
      border: 1px solid var(--stroke2);
      background: rgba(15,23,42,.04);
      color: var(--pending-tx); line-height: 1; white-space: nowrap;
    }
    .badge.ok{background: var(--ok-bg); border-color: var(--ok-bd); color: var(--ok-tx);}
    .badge.warn{background: var(--warn-bg); border-color: var(--warn-bd); color: var(--warn-tx);}
    .badge.bad{background: var(--bad-bg); border-color: var(--bad-bd); color: var(--bad-tx);}
    .badge.warn::before{content:"⚠️ "; font-size: 11px; letter-spacing: 0; text-transform:none}
    .accentRing:focus{outline:none;box-shadow:var(--ring)}
    .toggleWrap{background: rgba(15,23,42,.035); border:1px solid var(--stroke2)}
    .shadowSoft{box-shadow:var(--shadow)}
    .stickyTop{position:static;top:auto;z-index:auto}

    .stickyTop.glass{box-shadow: 0 10px 26px rgba(2,6,23,.10)}
    h1{letter-spacing:.06em}

    .empCard{
      box-shadow: var(--shadow2);
      transition: transform .18s ease, box-shadow .18s ease, border-color .18s ease;
      border-color: rgba(2,6,23,.06);
    }
    .empCard:hover{
      transform: translateY(-2px);
      box-shadow: var(--shadow);
      border-color: rgba(197,160,89,.22);
    }
    .empCard .font-extrabold.text-sm{
      font-size: 16px;
      line-height: 1.15;
      letter-spacing: -0.01em;
    }

    .empCard input[type="time"]{
      min-height: 48px;
      border: 1px solid rgba(2,6,23,.10);
      background: rgba(15,23,42,.03);
    }
    .empCard input[type="time"]:focus{
      outline: none;
      box-shadow: var(--ring);
      border-color: rgba(197,160,89,.45);
    }

    .empCard .mt-4 .grid > div:nth-child(2) input[type="time"]{
      background: rgba(197,160,89,.14) !important;
      border-color: rgba(197,160,89,.36) !important;
    }

    .empCard .mt-4 .grid{
      position: relative;
    }
    .empCard .mt-4 .grid::before{
      content:"";
      position:absolute;
      left:50%;
      top:6px;
      bottom:6px;
      width:1px;
      background: rgba(2,6,23,.08);
      transform: translateX(-50%);
      pointer-events:none;
    }

    .empCard .mt-4 .grid > div:first-child label::before{content:"⏰ "; font-size: 12px}
    .empCard .mt-4 .grid > div:nth-child(2) label::before{content:"📍 "; font-size: 12px}

    .toggleWrap{
      padding: 10px 12px;
      border-radius: 18px;
    }
    .toggleWrap label span{
      font-size: 10px !important;
      color: rgba(30,41,59,.60) !important;
      letter-spacing: .14em;
    }
    .toggleWrap input[type="checkbox"]{
      width: 18px !important;
      height: 18px !important;
      border-radius: 6px;
    }

    section.card > button{
      background: linear-gradient(180deg, rgba(197,160,89,.10), rgba(255,255,255,1));
      border-bottom: 1px solid rgba(2,6,23,.06);
    }
    section.card{
      box-shadow: var(--shadow2);
    }
    section.card + section.card{
      margin-top: 14px;
    }

    section.card .badge{
      font-size: 10px;
      padding: 6px 10px;
    }

    .kpiCard{
      box-shadow: var(--shadow2);
      border-color: rgba(2,6,23,.06);
    }
    .kpiValue{
      font-size: 1.875rem;
      line-height: 1.05;
      letter-spacing: -0.02em;
    }
    .kpiLabel{
      font-size: 11px;
      letter-spacing: .18em;
      color: rgba(30,41,59,.64);
    }
    .kpi-total{background: linear-gradient(180deg, rgba(30,41,59,.04), rgba(255,255,255,1))}
    .kpi-punched{background: linear-gradient(180deg, rgba(16,185,129,.10), rgba(255,255,255,1))}
    .kpi-off{background: linear-gradient(180deg, rgba(239,68,68,.10), rgba(255,255,255,1))}
    .kpi-pending{background: linear-gradient(180deg, rgba(30,41,59,.06), rgba(255,255,255,1))}
    .kpi-late{background: linear-gradient(180deg, rgba(245,158,11,.12), rgba(255,255,255,1))}
    .kpi-latemin{background: linear-gradient(180deg, rgba(245,158,11,.18), rgba(255,255,255,1))}

    .empCard[data-pending="1"] .badge:not(.ok):not(.warn):not(.bad){
      background: var(--pending-bg);
      border-color: var(--pending-bd);
      color: var(--pending-tx);
    }
    .empCard[data-incomplete="1"] .badge:not(.ok):not(.warn):not(.bad){
      background: var(--incomplete-bg);
      border-color: var(--incomplete-bd);
      color: var(--incomplete-tx);
    }

    .chipBtn{border-radius: 999px; padding: 10px 14px}

    ::-webkit-scrollbar{width: 10px}
    ::-webkit-scrollbar-track{background: rgba(2,6,23,.05); border-radius: 999px}
    ::-webkit-scrollbar-thumb{background: rgba(197,160,89,.55); border-radius: 999px; border: 2px solid rgba(2,6,23,.05)}
    ::-webkit-scrollbar-thumb:hover{background: rgba(197,160,89,.70)}
  </style>
</head>

<body class="pb-16">

  <div class="stickyTop glass border-b border-black/5">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center gap-3">
      <div class="flex-1 min-w-0">
        <div class="text-[10px] tracking-[0.22em] font-extrabold uppercase text-[color:var(--accent)]">Fès — Maroc</div>
        <div class="flex items-baseline gap-2">
          <h1 class="text-lg sm:text-xl font-extrabold tracking-tight truncate">GREY CORNER</h1>
          <span class="text-[11px] font-bold text-slate-500">• Feuille de présence</span>
        </div>

        <div id="roleLine" class="mt-1 text-[10px] font-extrabold uppercase tracking-[0.22em] text-slate-500">
          Mode : — (connexion requise)
        </div>
      </div>

      <div id="topActions" class="hidden items-center gap-2">
        <button id="btnLogout"
          class="btn px-4 py-2.5 rounded-full text-[11px] font-extrabold tracking-wide border border-black/10 bg-white hover:brightness-95 shadowSoft">
          🔒 Déconnexion
        </button>
      </div>
    </div>

    <div class="max-w-3xl mx-auto px-4 pb-3">
      <div id="loginWrap" class="card rounded-3xl p-4 shadowSoft">
        <div class="text-[10px] font-extrabold tracking-[0.18em] uppercase text-slate-500">Connexion</div>
        <div class="mt-3 grid grid-cols-1 sm:grid-cols-[1fr_1fr_auto] gap-2 items-stretch">
          <input id="loginEmail" type="email" placeholder="Email"
            class="w-full px-4 py-3 rounded-2xl card shadow-sm text-sm font-semibold accentRing bg-white" />
          <input id="loginPass" type="password" placeholder="Mot de passe"
            class="w-full px-4 py-3 rounded-2xl card shadow-sm text-sm font-semibold accentRing bg-white" />
          <button id="btnLogin"
            class="btn px-4 py-3 rounded-2xl shadowSoft bg-[color:var(--primary)] text-white font-extrabold text-[12px] tracking-wide whitespace-nowrap">
            Se connecter
          </button>
        </div>
        <div id="loginMsg" class="mt-2 text-[11px] font-bold text-red-700"></div>
      </div>

      <div id="filtersWrap" class="hidden">
        <div class="grid grid-cols-1 sm:grid-cols-[1fr_auto] gap-3 items-center mt-3">
          <div class="grid grid-cols-1 sm:grid-cols-[220px_1fr] gap-3 items-center">
            <input type="date" id="datePicker"
              class="w-full px-4 py-3 rounded-2xl card shadow-sm font-bold text-sm accentRing bg-white" />

            <div class="flex gap-2 flex-wrap">
              <button onclick="setFilter('all')" id="chip-all" class="chip chipBtn chip active px-3 py-2 rounded-full text-[11px] font-extrabold text-slate-700">Tous</button>
              <button onclick="setFilter('punched')" id="chip-punched" class="chip chipBtn px-3 py-2 rounded-full text-[11px] font-extrabold text-slate-700">Pointés (hA)</button>
              <button onclick="setFilter('off')" id="chip-off" class="chip chipBtn px-3 py-2 rounded-full text-[11px] font-extrabold text-slate-700">Repos (OUT)</button>
              <button onclick="setFilter('pending')" id="chip-pending" class="chip chipBtn px-3 py-2 rounded-full text-[11px] font-extrabold text-slate-700">En attente</button>
              <button onclick="setFilter('late')" id="chip-late" class="chip chipBtn px-3 py-2 rounded-full text-[11px] font-extrabold text-slate-700">Retard</button>
              <button onclick="setFilter('incomplete')" id="chip-incomplete" class="chip chipBtn px-3 py-2 rounded-full text-[11px] font-extrabold text-slate-700">Incomplet</button>
            </div>
          </div>

          <div class="flex gap-2 sm:justify-end items-stretch">
            <input id="searchInput" oninput="applyFilters()"
              placeholder="🔍 Rechercher un nom…"
              class="w-full sm:w-56 px-4 py-3 rounded-2xl card shadow-sm text-sm font-semibold accentRing bg-white" />
          </div>
        </div>

        <div id="infoSource" class="mt-2 text-[10px] font-extrabold uppercase tracking-[0.18em] text-slate-500 hidden">
          Source hA : —
        </div>

        <div id="exportMsg" class="mt-2 text-[11px] font-bold text-slate-500 hidden"></div>
      </div>
    </div>
  </div>

  <main class="max-w-3xl mx-auto px-4 pt-4">
    <div id="kpisWrap" class="hidden grid grid-cols-2 sm:grid-cols-6 gap-3 mb-5">
      <div class="card kpiCard kpi-total rounded-2xl p-3">
        <div class="kpiLabel text-[10px] font-extrabold tracking-[0.16em] uppercase">Total</div>
        <div id="kpiTotal" class="kpiValue font-extrabold tracking-tight mt-1">—</div>
      </div>
      <div class="card kpiCard kpi-punched rounded-2xl p-3">
        <div class="kpiLabel text-[10px] font-extrabold tracking-[0.16em] uppercase">Pointés (hA)</div>
        <div id="kpiPunched" class="kpiValue font-extrabold tracking-tight mt-1">—</div>
      </div>
      <div class="card kpiCard kpi-off rounded-2xl p-3">
        <div class="kpiLabel text-[10px] font-extrabold tracking-[0.16em] uppercase">Repos (OUT)</div>
        <div id="kpiOff" class="kpiValue font-extrabold tracking-tight mt-1">—</div>
      </div>
      <div class="card kpiCard kpi-pending rounded-2xl p-3">
        <div class="kpiLabel text-[10px] font-extrabold tracking-[0.16em] uppercase">En attente</div>
        <div id="kpiPending" class="kpiValue font-extrabold tracking-tight mt-1">—</div>
      </div>
      <div class="card kpiCard kpi-late rounded-2xl p-3">
        <div class="kpiLabel text-[10px] font-extrabold tracking-[0.16em] uppercase">Retards</div>
        <div id="kpiLate" class="kpiValue font-extrabold tracking-tight mt-1">—</div>
      </div>
      <div class="card kpiCard kpi-latemin rounded-2xl p-3 col-span-2 sm:col-span-1">
        <div class="kpiLabel text-[10px] font-extrabold tracking-[0.16em] uppercase">Minutes retard</div>
        <div id="kpiLateMin" class="kpiValue font-extrabold tracking-tight mt-1">—</div>
      </div>
    </div>

    <div id="staffList" class="space-y-6"></div>

    <div class="mt-10 text-center text-slate-400 text-[10px] font-extrabold uppercase tracking-[0.28em] pb-6">
      &copy; 2026 Grey Corner • Service & Hospitalité
    </div>
  </main>

    function uiExportMsg(text, ok=true){
      const el = document.getElementById("exportMsg");

      el.style.color = ok ? "#64748b" : "#b91c1c";

    function buildQuery(params){
      return Object.keys(params)
        .filter(k => params[k] !== undefined && params[k] !== null)
        .map(k => `${encodeURIComponent(k)}=${encodeURIComponent(String(params[k]))}`)
        .join("&");
    }

    function exportToSheet(action, payload){
      const params = { action, secret: EXPORT_SECRET, timestamp: Date.now(), ...payload };
      const url = `${EXPORT_URL}?${buildQuery(params)}`;
      try{
        const img = new Image();
        img.onload = () => uiExportMsg("Export Google Sheet ✅", true);
        img.onerror = () => uiExportMsg("Export Google Sheet ✅", true);
        img.src = url;
        uiExportMsg("Export Google Sheet…", true);
        return true;
      }catch(e){
        console.log("EXPORT FAIL:", e);
        uiExportMsg("Export Google Sheet ❌", false);
        return false;
      }

    function normalizeHHMM(v){
      const s = String(v || "").trim();
      return /^([01]\d|2[0-3]):[0-5]\d$/.test(s) ? s : "";
    }

    function schedulePresenceExport(empKey, name, selectedDate, data){
      const key = `${selectedDate}__${empKey}`;
      clearTimeout(__exportTimers.get(key));

        const safeHP = normalizeHHMM(data.hP);
        const safeHA = normalizeHHMM(data.hA);

          date: selectedDate,
          empKey,
          name,
          hP: safeHP,
          hA: safeHA,
          off: data.off,
          retard: data.retard,
          retardMin: data.retardMin
        });

        exportToSheet("presence", {
          date: selectedDate,
          empKey,
          name,
          hP: safeHP,
          hA: safeHA,
          off: (typeof data.off === "boolean" ? data.off : ""),
          retard: (typeof data.retard === "boolean" ? data.retard : ""),
          retardMin: (typeof data.retardMin === "number" ? data.retardMin : "")

    function matchCuisineStaffKey(nameOrId) {
      if(!nameOrId) return null;
      const s = String(nameOrId).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      if(s.includes("NAOUAL") || s.includes("BOUCHNAK")) return "NAOUAL";
      if(s.includes("KHAOULA") || s.includes("BELQAS")) return "KHAOULA";
      if(s.includes("FATIMA") || s.includes("ZAIR")) return "FATIMA";
      if(s.includes("JIHANE") || s.includes("MAJDOUB")) return "JIHANE";
      if(s.includes("IMANE") || s.includes("MOUJAHID")) return "IMANE";
      if(s.includes("ANAS") || s.includes("BOURAHMA")) return "ANAS";
      if(s.includes("JAWAD") || s.includes("JAOUAD") || s.includes("LEMSSIEH") || s.includes("LAMSSIAH")) return "JAWAD";
      if(s.includes("SAAD") || s.includes("IDRISSI")) return "SAAD";
      return null;
    }

    function getCuisinePlanningInfo(empKeyOrName, dateISO) {
      if(!dateISO) return null;
      const memberKey = matchCuisineStaffKey(empKeyOrName);
      if(!memberKey) return null;
      const [yy, mm, dd] = String(dateISO).split('-').map(Number);
      if(!yy || !mm || !dd) return null;
      const dt = new Date(Date.UTC(yy, mm - 1, dd));
      const dayOfWeek = dt.getUTCDay();
      return PLANNING_CUISINE[dayOfWeek]?.[memberKey] || null;
    }

    // ─── PLANNING FIXE SOUMIA (CAISSE) ───
    // HP unique de 09:00 chaque jour sauf Mardi jour OFF
    function isSoumiaStaff(idOrName) {
      if(!idOrName) return false;
      const s = String(idOrName).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return s.includes("SOUMIA") || s.includes("NHAILI") || s.includes("NHAJLI") || s.includes("ENNHAILI");
    }

    function getSoumiaPlanning(dateISO) {
      if(!dateISO) return null;
      const [yy, mm, dd] = String(dateISO).split('-').map(Number);
      if(!yy || !mm || !dd) return null;
      const dt = new Date(Date.UTC(yy, mm - 1, dd));
      const dayOfWeek = dt.getUTCDay(); // 0: Dim, 1: Lun, 2: Mar, 3: Mer, 4: Jeu, 5: Ven, 6: Sam
      if(dayOfWeek === 2) {
        return { off: true, hP: null, shift: "OFF" };
      }
      return { off: false, hP: "09:00", shift: "09:00" };
    }

    // ─── PLANNING FIXE CAISSE (SALIL HOUDA & BENKHADA ABDESLAM) ───
    // Travail continu sans repos 24h : alternance quotidienne entre 07:30 et 15:00
    // Ancre : le 24 Septembre 2026, SALIL commence à 07:30 et BENKHADA à 15:00. Le lendemain l'inverse.
    function isSalilStaff(idOrName) {
      if(!idOrName) return false;
      const s = String(idOrName).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return s.includes("SALIL") || s.includes("SALIH") || s.includes("HOUDA");
    }

    function isBenkhadaStaff(idOrName) {
      if(!idOrName) return false;
      const s = String(idOrName).toUpperCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      return s.includes("BENKHADA") || s.includes("ABDESLAM") || s.includes("ABDESSLAM") || s.includes("ABDELSSAM");
    }

    function getCaisseAlternance(idOrName, dateISO) {
      if(!dateISO) return null;
      const [yy, mm, dd] = String(dateISO).split('-').map(Number);
      if(!yy || !mm || !dd) return null;
      const isSal = isSalilStaff(idOrName);
      const isBen = isBenkhadaStaff(idOrName);
      if(!isSal && !isBen) return null;

      // Ancre : 24 Septembre 2026 (mois 8 = Septembre)
      const dAnchor = Date.UTC(2026, 8, 24);
      const dTarget = Date.UTC(yy, mm - 1, dd);
      const diffDays = Math.round((dTarget - dAnchor) / 86400000);
      const mod = ((diffDays % 2) + 2) % 2;

      // mod 0 (24 Sept) : Salil = 07:30, Benkhada = 15:00
      // mod 1 (25 Sept) : Salil = 15:00, Benkhada = 07:30
      if(mod === 0) {
        return isSal
          ? { hP: "07:30", off: false, shift: "07:30" }
          : { hP: "15:00", off: false, shift: "15:00" };
      } else {
        return isSal
          ? { hP: "15:00", off: false, shift: "15:00" }
          : { hP: "07:30", off: false, shift: "07:30" };
      }
    }

    function parseSheetCsvLine(line) {
      const out = []; let cur = ""; let inQ = false;
      for (let i = 0; i < line.length; i++) {
        const ch = line[i];
        if (ch === '"') { if (inQ && line[i+1]==='"') { cur+='"'; i++; } else inQ=!inQ; continue; }
        if (ch === ',' && !inQ) { out.push(cur.trim()); cur=""; continue; }
        cur += ch;
      }
      out.push(cur.trim());
      return out;
    }

    function parseSheetDateLabel(label) {
      if (!label) return null;
      let s = String(label).toLowerCase().trim();
      s = s.normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      s = s.replace(/\./g, "");

      let m = s.match(/\b(\d{4})[\/-](\d{1,2})[\/-](\d{1,2})\b/);
      if (m) { const d = new Date(+m[1], +m[2]-1, +m[3]); d.setHours(0,0,0,0); return d; }
      m = s.match(/\b(\d{1,2})[\/-](\d{1,2})[\/-](\d{4})\b/);
      if (m) { const d = new Date(+m[3], +m[2]-1, +m[1]); d.setHours(0,0,0,0); return d; }

      const months = {
        "janvier":0,"janv":0, "fevrier":1,"fev":1, "mars":2, "mar":2, "avril":3,"avr":3,
        "mai":4, "juin":5, "juillet":6,"juil":6, "aout":7, "septembre":8,"sept":8,
        "octobre":9,"oct":9, "novembre":10,"nov":10, "decembre":11,"dec":11
      };

      m = s.match(/\b(\d{1,2})\s+([a-z]+)(?:\s+(\d{4}))?/);
      if (m) {
        const day = +m[1];
        const monthName = m[2];
        const year = m[3] ? +m[3] : new Date().getFullYear();
        if (months.hasOwnProperty(monthName)) {
          const d = new Date(year, months[monthName], day);
          d.setHours(0,0,0,0);
          return d;
        }
      }
      return null;
    }

    function isStaffInSheetShift(shiftStr, emp) {
      if(!shiftStr || !shiftStr.trim() || shiftStr === "-" || shiftStr.includes("— Repos —")) return false;
      const s = shiftStr.toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const nom = String(emp.nom || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const prenom = String(emp.prenom || "").toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g, "");
      const fullName = `${nom} ${prenom}`;

      // 1. Découpage en mots (ex: "EL MOKHTAR" -> mot "mokhtar" correspond à "mokhtar (ter1)")
      const words = fullName.split(/[\s_-]+/).filter(w => w.length >= 3 && w !== "el" && w !== "al");
      for (const w of words) {
        if (s.includes(w)) return true;
      }

      // 2. Correspondances spécifiques pour le personnel Grey Corner
      // ALAOUI LAZIZ <-> "aziz" / "laziz"
      if ((fullName.includes("laziz") || fullName.includes("alaoui") || fullName.includes("aziz")) && (s.includes("aziz") || s.includes("laziz"))) {
        return true;
      }

      // KTAMI EL MOKHTAR <-> "mokhtar"
      if ((fullName.includes("mokhtar") || fullName.includes("ktami")) && s.includes("mokhtar")) {
        return true;
      }

      // KAFOUNI ZAKARIAE <-> "zakaria" / "zakariae"
      if ((fullName.includes("zakaria") || fullName.includes("kafouni")) && (s.includes("zakaria") || s.includes("zakariae"))) {
        return true;
      }

      // ELKOBBI MOSTAFA <-> "mostafa" / "mustapha" / "mosatafe"
      if ((fullName.includes("mostafa") || fullName.includes("mustapha") || fullName.includes("elkobbi")) &&
          (s.includes("mostafa") || s.includes("mustapha") || s.includes("mosatafe"))) {
        return true;
      }

      // BOURAHMA ANAS <-> "anas" / "anass"
      if ((fullName.includes("anas") || fullName.includes("bourahma")) && (s.includes("anas") || s.includes("anass"))) {
        return true;
      }

      return false;
    }

    function normalizeKeyPart(x){
      return String(x || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, "_");
    }

    function normalizeLabelPart(x){
      return String(x || "")
        .trim()
        .toUpperCase()
        .replace(/\s+/g, " ");
    }

    function empId(emp){
      return `${normalizeKeyPart(emp?.nom)}_${normalizeKeyPart(emp?.prenom)}`;

    }

    function mergeEmpMaps(a, b){
      const out = JSON.parse(JSON.stringify(a || {}));
      Object.keys(b || {}).forEach(empId=>{
        out[empId] = { ...(out[empId] || {}), ...(b[empId] || {}) };
      });
      return out;
    }

    function timeToMin(t){
      if(!t || typeof t !== "string" || !t.includes(":")) return null;
      const [h,m] = t.split(":").map(Number);
      if(Number.isNaN(h) || Number.isNaN(m)) return null;
      return h*60+m;
    }

    function lateMinutes(hP, hA, id = null, date = null){
      if(id && (noLateCalcIds.includes(id) || isMenageStaff(id))) return null;
      if(!hA) return null;
      let effectiveHP = hP;
      if(!effectiveHP && id){
        const emp = EQUIPE.find(x => empId(x) === id);
        if(isSoumiaStaff(id)) {
          const selectedDate = date || document.getElementById('datePicker')?.value;
          const plan = getSoumiaPlanning(selectedDate);
          if(plan && !plan.off && plan.hP) effectiveHP = plan.hP;
        } else if(isSalilStaff(id) || isBenkhadaStaff(id)) {
          const selectedDate = date || document.getElementById('datePicker')?.value;
          const plan = getCaisseAlternance(id, selectedDate);
          if(plan && plan.hP) effectiveHP = plan.hP;
        } else if(emp && (emp.poste === "SECURITE" || emp.poste === "SÉCURITÉ")) {
          effectiveHP = "09:00";
        } else if(emp && emp.poste === "CUISINE") {
          const selectedDate = date || document.getElementById('datePicker')?.value;
          const plan = getCuisinePlanningInfo(id, selectedDate);
          if(plan && !plan.off && plan.hP) {
            effectiveHP = plan.hP;
          }
        }
      }
      const p = timeToMin(effectiveHP);
      const a = timeToMin(hA);
      if(p === null || a === null) return null;
      return Math.max(0, a - p);
    }

    function fmtLate(min){
      if(min === null) return "—";
      if(min <= 0) return "À l'heure";
      return `+${min} min`;
    }

    function normalizeEquipeSnapshot(val){
      if(!val) return [];
      const arr = Array.isArray(val)
        ? val.filter(Boolean)
        : Object.keys(val).sort((a,b)=>Number(a)-Number(b)).map(k => val[k]).filter(Boolean);

      const cleaned = arr
        .map(x => ({
          nom: normalizeLabelPart(x?.nom),
          prenom: normalizeLabelPart(x?.prenom),
          poste: normalizeLabelPart(x?.poste),
          dateDebut: String(x?.dateDebut || "").trim()
        }))
        .filter(x => x.nom && x.prenom && x.poste);

      const seen = new Set();
      const out = [];
      for(const e of cleaned){
        const id = `${normalizeKeyPart(e.nom)}_${normalizeKeyPart(e.prenom)}`;
        if(seen.has(id)) continue;
        seen.add(id);
        out.push(e);
      }
      return out;
    }

      const merged = {};

      EQUIPE.forEach(emp => {

        const p = presencesCache[id] || {};

        merged[id] = {

          hP: normalizeHHMM(p?.hP || pu?.hP || ""),
          hA: normalizeHHMM((pu && pu.hA) ? pu.hA : (p && p.hA ? p.hA : "")),
          retard: (pu && typeof pu.retard === "boolean") ? pu.retard : (p && typeof p.retard === "boolean" ? p.retard : false),
          retardMin: (pu && typeof pu.retardMin === "number") ? pu.retardMin : (p && typeof p.retardMin === "number" ? p.retardMin : 0),
          off: p?.off === true
        };
      });

      latestDataCache = merged;

    async function upd(id, f, v){
      const date = document.getElementById('datePicker').value;
      const emp = EQUIPE.find(x => empId(x) === id);
      const name = emp ? empName(emp) : "";

      if(f === "off"){
        if(!canEditOFF(date)) return;
        const val = !!v;
        const ref = database.ref('presences/'+date+'/'+id);

        const payload = { off: val };
        if(val === true){
          payload.hA = null;
          payload.retard = null;
          payload.retardMin = null;
          payload.on = false;
        }

        try{
          await ref.update(payload);

          const cur = latestDataCache[id] || {};
          schedulePresenceExport(id, name, date, {
            hP: cur.hP || "",
            hA: val ? "" : (cur.hA || ""),
            off: val,
            retard: val ? false : (cur.retard ?? false),
            retardMin: val ? 0 : (cur.retardMin ?? 0)
          });
        }catch(e){
          console.warn("Write blocked:", id, f, e);
        }
        return;
      }

      if(f === "hP"){
        if(!canEditHP(id, date)) return;

        const hp = normalizeHHMM(v);
        if(hp){
          saveHPHistory(id, hp);
        }
        const ref = database.ref('presences/'+date+'/'+id);

        try{
          await ref.update({ hP: hp || null });

          const cur = latestDataCache[id] || {};
          const hA = normalizeHHMM(cur.hA || "");
          const lm = lateMinutes(hp, hA, id);
          const isLate = (lm !== null && lm > 0);

          schedulePresenceExport(id, name, date, {
            hP: hp || "",
            hA: hA || "",
            off: (typeof cur.off === "boolean" ? cur.off : ""),
            retard: (hA ? !!isLate : ""),
            retardMin: (hA ? (lm || 0) : "")
          });
        }catch(e){
          console.warn("Write blocked:", id, f, e);
        }
        return;
      }

      if(f === "hA"){
        const selectedDate = date;
        const hA = normalizeHHMM(v);
        const hP = normalizeHHMM((presencesCache[id]?.hP) || (latestDataCache[id]?.hP) || "");
        const lm = lateMinutes(hP, hA, id);
        const isLate = (lm !== null && lm > 0);
        const now = Date.now();

        try{
          if(isGerant()){
            const refPunch = database.ref('punches/'+selectedDate+'/'+id);
            const payloadPunch = {
              empKey: id,
              hA: hA || null,
              retard: !!(hA && isLate),
              retardMin: hA ? (lm || 0) : 0,
              timestamp: now
            };
            if(hA) await refPunch.set(payloadPunch);
            else await refPunch.remove();

            const refPres = database.ref('presences/'+selectedDate+'/'+id);
            const payloadPres = hA ? {
              hA: hA,
              retard: !!isLate,
              retardMin: (lm || 0),
              timestamp: now,
              lastEditAt: now,
              lastEditByAdmin: true
            } : {
              hA: null,
              retard: null,
              retardMin: null,
              timestamp: null,
              lastEditAt: now,
              lastEditByAdmin: true
            };
            await refPres.update(payloadPres);

            schedulePresenceExport(id, name, selectedDate, {
              hP: hP || "",
              hA: hA || "",
              off: (typeof (latestDataCache[id]?.off) === "boolean" ? latestDataCache[id].off : ""),
              retard: (hA ? !!isLate : ""),
              retardMin: (hA ? (lm || 0) : "")
            });
            return;
          }

          if(!canEditHA(id, selectedDate)){
            console.warn("Equipe cannot edit hA:", id);
            return;
          }

          const refPres = database.ref('presences/'+selectedDate+'/'+id);
          const payload = hA ? {
            hA: hA,
            retard: !!isLate,
            retardMin: (lm || 0),
            timestamp: now,
            lastEditAt: now,
            lastEditByAdmin: false
          } : {
            hA: null,
            retard: null,
            retardMin: null,
            timestamp: null,
            lastEditAt: now,
            lastEditByAdmin: false
          };
          await refPres.update(payload);

          schedulePresenceExport(id, name, selectedDate, {
            hP: hP || "",
            hA: hA || "",
            off: (typeof (latestDataCache[id]?.off) === "boolean" ? latestDataCache[id]?.off : ""),
            retard: (hA ? !!isLate : ""),
            retardMin: (hA ? (lm || 0) : "")
          });

        }catch(e){
          console.warn("hA write blocked:", id, e);
        }
        return;
      }

      try{
        await database.ref('presences/'+date+'/'+id).update({[f]:v});
      }catch(e){
        console.warn("Write blocked:", id, f, e);
      }
    }

    async function applySheetPlanningForPoste(poste, sheetUrl, dateISO) {
      if(!canEditHP("", dateISO)) {
        alert("Action réservée au Gérant ou pour la date d'aujourd'hui.");
        return;
      }
      const members = EQUIPE.filter(e => e.poste === poste);
      if(!members.length) {
        alert(`Aucun membre trouvé pour le poste ${poste}.`);
        return;
      }

      uiExportMsg(`Lecture Sheet ${poste}…`, true);

      try {
        const resp = await fetch(sheetUrl, { cache: "no-store" });
        const text = await resp.text();
        const rows = text.split(/\r?\n/).map(r => r.trim()).filter(Boolean);

        const [yy, mm, dd] = dateISO.split('-').map(Number);
        const targetDate = new Date(yy, mm - 1, dd);
        targetDate.setHours(0,0,0,0);

        let matchingRow = null;
        for(let i = 1; i < rows.length; i++) {
          const c = parseSheetCsvLine(rows[i]);
          if(!c[0] || c[0].toUpperCase().includes("DATE")) continue;
          const rowDate = parseSheetDateLabel(c[0]);
          if(rowDate && rowDate.getFullYear() === targetDate.getFullYear() &&
             rowDate.getMonth() === targetDate.getMonth() &&
             rowDate.getDate() === targetDate.getDate()) {
            matchingRow = c;
            break;
          }
        }

        if(!matchingRow) {
          alert(`Date ${dateISO} introuvable dans le Google Sheet ${poste}.`);
          uiExportMsg(`Date absente du Sheet ⚠️`, false);
          return;
        }

        const matinStr = matchingRow[1] || "";
        const soirStr  = matchingRow[2] || "";

        const updates = {};
        members.forEach(emp => {
          const id = empId(emp);
          const inMatin = isStaffInSheetShift(matinStr, emp);
          const inSoir  = isStaffInSheetShift(soirStr, emp);

          if(inMatin && inSoir) {
            updates[`presences/${dateISO}/${id}/hP`] = SHIFT_H_MATIN; // 07:00
            updates[`presences/${dateISO}/${id}/off`] = false;
          } else if(inMatin) {
            updates[`presences/${dateISO}/${id}/hP`] = SHIFT_H_MATIN; // 07:00
            updates[`presences/${dateISO}/${id}/off`] = false;
          } else if(inSoir) {
            updates[`presences/${dateISO}/${id}/hP`] = SHIFT_H_SOIR;  // 14:30
            updates[`presences/${dateISO}/${id}/off`] = false;
          } else {
            updates[`presences/${dateISO}/${id}/off`] = true;
            updates[`presences/${dateISO}/${id}/hP`] = null;
          }
        });

        await database.ref().update(updates);
        uiExportMsg(`Planning ${poste} appliqué (${dateISO}) ✅`, true);
      } catch(e) {
        console.error(`Erreur application planning ${poste}:`, e);
        alert(`Erreur réseau lors de la lecture du Google Sheet ${poste}.`);
        uiExportMsg(`Erreur Sheet ${poste} ❌`, false);
      }
    }

            card.className = "card rounded-2xl p-4 empCard";
            card.dataset.name = `${emp.nom} ${emp.prenom}`.toLowerCase();
            card.dataset.punched = hasHA ? "1" : "0";
            card.dataset.off = isOff ? "1" : "0";
            card.dataset.pending = (!handled) ? "1" : "0";
            card.dataset.late = isLate ? "1" : "0";
            card.dataset.incomplete = incomplete ? "1" : "0";

            card.innerHTML = `
              <div class="flex items-start justify-between gap-3">
                <div class="min-w-0">
                  <div class="font-extrabold text-sm tracking-tight text-slate-900 truncate">
                    ${emp.nom} ${emp.prenom}
                  </div>
                  <div class="mt-2 flex gap-2 flex-wrap">
                    ${statusBadges.join("")}
                  </div>
                </div>

                <div class="toggleWrap rounded-2xl p-2 flex gap-2">
                  <label class="flex flex-col items-center px-2">
                    <span class="text-[9px] font-extrabold text-slate-400 tracking-wide">OUT</span>
                    <input type="checkbox" class="w-4 h-4 accent-[color:var(--accent)]"
                      ${isOff ? "checked" : ""} ${canOFF ? "" : "disabled"}
                      onchange="upd('${id}','off',this.checked)">
                  </label>
                </div>
              </div>

              ${isMenage ? `
                <div class="mt-4 p-3 rounded-2xl bg-sky-50/70 border border-sky-200/80">
                  <div class="flex items-center justify-between gap-3 mb-2">
                    <div>
                      <label class="text-[10px] font-extrabold tracking-[0.14em] uppercase text-sky-950 block">
                        🧹 Arrivée réelle (hA) — Saisie Manuelle
                      </label>
                      <p class="text-[10px] text-sky-700 font-semibold mt-0.5">
                        Pas de badgeuse. Saisir l'arrivée ici si présente (repos et congés calculés automatiquement sans hA).
                      </p>
                    </div>
                    ${canHA && safeHA ? `
                      <button type="button" onclick="upd('${id}','hA','')"
                        title="Effacer le pointage"
                        class="text-[10px] font-extrabold text-red-700 bg-red-50 hover:bg-red-100 border border-red-200 rounded-lg px-2 py-1 transition-all active:scale-95 flex items-center gap-1">
                        ✕ Effacer
                      </button>
                    ` : ''}
                  </div>
                  <div class="flex items-center gap-3">
                    <div class="flex-1">
                      ${
                        canHA
                        ? `<input type="time" step="60"
                            class="w-full rounded-xl text-sm font-extrabold px-3 py-2 accentRing"
                            style="background: #ffffff; border:1.5px solid rgba(14,165,233,.45); color:#0c4a6e"
                            value="${safeHA}"
                            placeholder="--:--"
                            onchange="upd('${id}','hA',this.value)">`
                        : `<div class="w-full bg-slate-100 rounded-xl text-sm font-extrabold px-3 py-2 text-slate-500 text-center">
                            ${safeHA || "Non renseigné"}
                          </div>`
                      }
                    </div>
                    <div class="text-[11px] font-extrabold text-slate-600 whitespace-nowrap">
                      ${safeHA ? '✅ Présent' : '💤 Repos / Congé auto'}
                    </div>
                  </div>
                </div>
              ` : `
                <div class="mt-4 grid grid-cols-2 gap-3">
                  <div>
                    <div class="flex items-center justify-between mb-1">
                      <label class="text-[10px] font-extrabold tracking-[0.14em] uppercase text-slate-500 block">Shift prévu (hP)</label>
                      ${empLastHP && empLastHP !== displayHP && canHP ? `
                        <button type="button" onclick="upd('${id}','hP','${empLastHP}')"
                          title="Appliquer le dernier shift utilisé (${empLastHP})"
                          class="text-[9px] font-extrabold text-amber-700 bg-amber-50 hover:bg-amber-100 border border-amber-200/80 rounded-md px-1.5 py-0.5 transition-all inline-flex items-center gap-1 active:scale-95">
                          ⚡ ${empLastHP}
                        </button>
                      ` : ''}
                    </div>
                    <input type="time" step="60" list="hpHistoryDatalist"
                      class="w-full bg-[color:var(--soft)] rounded-xl text-sm font-bold px-3 py-2 accentRing"
                      value="${displayHP}"
                      ${canHP ? "" : "disabled"}
                      onchange="upd('${id}','hP',this.value)">
                    ${soumiaPlan ? `
                      <div class="mt-1 flex items-center gap-1.5 flex-wrap">
                        <span class="text-[9px] font-bold text-purple-800 bg-purple-50 border border-purple-200/80 rounded px-1.5 py-0.5">
                          💜 ${soumiaPlan.off ? 'Repos Fixe (Mardi)' : 'Shift Unique : 09:00'}
                        </span>
                        ${canHP && !soumiaPlan.off && safeHP !== "09:00" ? `
                          <button type="button" onclick="upd('${id}','hP','09:00')"
                            title="Appliquer 09:00"
                            class="text-[9px] font-extrabold text-purple-800 hover:bg-purple-100 bg-purple-50 border border-purple-300 rounded px-1.5 py-0.5 transition-all active:scale-95">
                            ⚡ 09:00
                          </button>
                        ` : ''}
                      </div>
                    ` : ''}
                    ${caissePlan ? `
                      <div class="mt-1 flex items-center gap-1.5 flex-wrap">
                        <span class="text-[9px] font-bold text-indigo-800 bg-indigo-50 border border-indigo-200/80 rounded px-1.5 py-0.5">
                          🔄 Rotation 24h : <strong>${caissePlan.shift}</strong>
                        </span>
                        ${canHP && (safeHP !== caissePlan.hP || isOff) ? `
                          <button type="button" onclick="applySingleCaissePlan('${id}', '${selectedDate}')"
                            title="Appliquer le shift de rotation (${caissePlan.shift})"
                            class="text-[9px] font-extrabold text-indigo-800 hover:bg-indigo-100 bg-indigo-50 border border-indigo-300 rounded px-1.5 py-0.5 transition-all active:scale-95">
                            ⚡ Appliquer
                          </button>
                        ` : ''}
                      </div>
                    ` : ''}
                    ${cuisinePlan ? `
                      <div class="mt-1 flex items-center gap-1.5 flex-wrap">
                        <span class="text-[9px] font-bold text-amber-800 bg-amber-50 border border-amber-200/80 rounded px-1.5 py-0.5">
                          📋 Plan: <strong>${cuisinePlan.shift}</strong>
                        </span>
                        ${canHP && (safeHP !== cuisinePlan.hP || isOff !== cuisinePlan.off) ? `
                          <button type="button" onclick="applySingleCuisinePlan('${id}', '${selectedDate}')"
                            title="Appliquer le shift du planning fixe"
                            class="text-[9px] font-extrabold text-amber-800 hover:bg-amber-100 bg-amber-50 border border-amber-300 rounded px-1.5 py-0.5 transition-all active:scale-95">
                            ⚡ Appliquer
                          </button>
                        ` : ''}
                      </div>
                    ` : ''}
                    ${canHP && hpHistory.length > 0 ? `
                      <div class="mt-1 flex flex-wrap gap-1 items-center py-0.5">
                        <span class="text-[8px] font-bold text-slate-400 uppercase tracking-wider">Habituels:</span>
                        ${hpHistory.map(h => `
                          <button type="button" onclick="upd('${id}','hP','${h}')"
                            class="text-[9px] font-bold px-1.5 py-0.5 rounded ${safeHP === h ? 'bg-amber-500 text-white font-extrabold shadow-sm' : 'bg-slate-200/70 text-slate-700 hover:bg-amber-100 hover:text-amber-900'} transition-colors">
                            ${h}
                          </button>
                        `).join('')}
                      </div>
                    ` : ''}
                  </div>

                  <div>
                    <label class="text-[10px] font-extrabold tracking-[0.14em] uppercase text-slate-500 mb-1 block">Arrivée réelle (hA)</label>
                    ${
                      canHA
                      ? `<input type="time" step="60"
                          class="w-full rounded-xl text-sm font-extrabold px-3 py-2 accentRing"
                          style="background: rgba(197,160,89,.10); border:1px solid rgba(197,160,89,.30)"
                          value="${safeHA}"
                          onchange="upd('${id}','hA',this.value)">`
                      : `<div class="w-full bg-slate-100 rounded-xl text-sm font-extrabold px-3 py-2 text-slate-500 text-center">
                          ${safeHA || "--:--"}
                        </div>`
                    }
                  </div>
                </div>
              `}
            `;

            body.appendChild(card);
          });

        section.appendChild(header);
        section.appendChild(body);
        list.appendChild(section);
      });

      computeKPIs();
      applyFilters();
    }

    function computeKPIs(){
      const total = EQUIPE.length;
      let punched = 0, off = 0, pending = 0, lateCount = 0, lateMinSum = 0;
      const selectedDate = document.getElementById('datePicker')?.value;

      EQUIPE.forEach(emp => {
        const id = empId(emp);
        const d = latestDataCache[id] || {};

        const safeHP = normalizeHHMM(d.hP || "");
        const safeHA = normalizeHHMM(d.hA || "");
        const isOff  = d.off === true;
        const hasHA  = !!safeHA;

        const isSecurite = (emp.poste === "SECURITE" || emp.poste === "SÉCURITÉ");
        const isCuisine = (emp.poste === "CUISINE");
        const isSoumia = isSoumiaStaff(id);
        const cuisinePlan = isCuisine ? getCuisinePlanningInfo(id, selectedDate) : null;
        const soumiaPlan = isSoumia ? getSoumiaPlanning(selectedDate) : null;
        const effectiveHP = safeHP || (soumiaPlan && !soumiaPlan.off ? soumiaPlan.hP : (isSecurite ? "09:00" : (cuisinePlan && !cuisinePlan.off ? cuisinePlan.hP : "")));
        const effectiveHasHP = !!effectiveHP;

        const handled = isOff || hasHA;

        if(hasHA) punched++;
        if(isOff) off++;
        if(!handled) pending++;

        if(effectiveHasHP && hasHA){
          const lm = lateMinutes(effectiveHP, safeHA, id, selectedDate);
          if(lm !== null && lm > 0){
            lateCount++;
            lateMinSum += lm;
          }
        }
      });

      document.getElementById("kpiTotal").textContent = total;
      document.getElementById("kpiPunched").textContent = punched;
      document.getElementById("kpiOff").textContent = off;
      document.getElementById("kpiPending").textContent = pending;
      document.getElementById("kpiLate").textContent = lateCount;
      document.getElementById("kpiLateMin").textContent = lateMinSum;
    }

    function startEquipeListener(){
      stopEquipeListener();

      equipeRef = database.ref("settings/equipe");
      equipeCb = (snap) => {
        const val = snap.val();
        const norm = normalizeEquipeSnapshot(val);
        EQUIPE = norm.length ? norm : DEFAULT_EQUIPE;
        rebuildMerged();
        render();
      };
      equipeRef.on("value", equipeCb);
    }

    function load(){
      const selectedDate = document.getElementById('datePicker').value;

      stopListeners();
      presencesCache = {};
      punchesCache = {};
      rootPunchesCache = {};

      const refPres = database.ref('presences/' + selectedDate);
      const cbPres = (snap) => {
        presencesCache = snap.val() || {};
        collectHPFromCache();
        rebuildMerged();
        render();
      };
      refPres.on("value", cbPres);
      activeRefs.push({ref: refPres, cb: cbPres});

      if(isGerant()){
        const refPunch = database.ref('punches/' + selectedDate);
        const cbPunch = (snap) => {
          punchesCache = snap.val() || {};
          rebuildMerged();
          render();
        };
        refPunch.on("value", cbPunch);
        activeRefs.push({ref: refPunch, cb: cbPunch});

        const refRootPunch = database.ref(selectedDate);
        const cbRootPunch = (snap) => {
          rootPunchesCache = snap.val() || {};
          rebuildMerged();
          render();
        };
        refRootPunch.on("value", cbRootPunch);
        activeRefs.push({ref: refRootPunch, cb: cbRootPunch});
      }else{
        punchesCache = {};
        rootPunchesCache = {};
        rebuildMerged();
        render();
      }
    }

    function initApp(){
      if(appInitialized) return;
      appInitialized = true;

      initHPHistory();

      const dp = document.getElementById('datePicker');
      dp.value = getMarocDate();
      dp.addEventListener('change', load);

      startEquipeListener();
      load();
    }

    auth.onAuthStateChanged(async (user) => {
      if(!user){
        role = null;
        stopListeners();
        stopEquipeListener();
        presencesCache = {};
        punchesCache = {};
        rootPunchesCache = {};
        latestDataCache = {};
        EQUIPE = [];
        appInitialized = false;
        showLoginUI();
        return;
      }

      role = await fetchRole(user.uid);
      const isMaster = (user.email||"").toLowerCase().includes("hicham");
      if(!role && isMaster){
        role = "gerant";
        try{ await database.ref("users/"+user.uid).set("gerant"); }catch(_){}
      }

      if(role !== "gerant" && role !== "equipe"){
        if(isMaster){
          role = "gerant";
          try{ await database.ref("users/"+user.uid).set("gerant"); }catch(_){}
        } else {
          await auth.signOut();
          role = null;
          showLoginUI();
          document.getElementById("loginMsg").textContent =
            "Compte non autorisé (rôle manquant dans /users).";
          return;
        }
      }

      showLoggedUI();
      initApp();
    });
  </script>
</body>
</html>
